<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Unternehmens-Schule</title>
<meta name="theme-color" content="#070b12">
<meta name="description" content="Lern-App: Wie Unternehmen entstehen – BMW, Nvidia, Apple, Microsoft, Google, Amazon, Tesla, Red Bull, Meta, Coca-Cola, IBM, Nintendo, Huawei, Ferrari, McDonald's, Disney, Boeing, Samsung, Nestlé, IKEA, Porsche, Siemens, Bosch und Adidas. Mit kleinen Erklärvideos und Quiz.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unternehmen">
<style>
:root,[data-theme="dark"]{
 --bg:#070b12;--panel:#0e1522;--panel2:#141d2e;--line:#1f2b40;--tx:#e6edf7;--mut:#8a99b3;
 --gold:#f5b301;--cyan:#22d3ee;--green:#22c55e;--violet:#a78bfa;--red:#f43f5e;--blue:#3b82f6;--pink:#f472b6;--orange:#fb923c;
 --road:#2c3a52;--blk:#1a2436;--scene:#0a101b;--body:#1c2a40;--glass:#0b3b4f;--white:#ffffff;--ink:#0a0f18;--tire:#05080d;
 --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
 --bg:#eef2f7;--panel:#ffffff;--panel2:#f2f5fa;--line:#d6deea;--tx:#0f172a;--mut:#56657f;
 --gold:#b7860b;--cyan:#0e8fae;--green:#15803d;--violet:#7c3aed;--red:#e11d48;--blue:#2563eb;--pink:#db2777;--orange:#ea580c;
 --road:#b6c1d1;--blk:#dfe6ef;--scene:#f8fafc;--body:#dbe4f0;--glass:#b9e3f2;--white:#ffffff;--ink:#0a0f18;--tire:#1e293b;
 --shadow:0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.mono{font-family:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
#app{display:flex;min-height:100vh}
#side{display:none}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:0 14px 40px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--green));color:#fff;font-weight:800;font-size:17px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.brand>div:last-child{min-width:0}
.theme{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.theme button{border:0;background:none;padding:5px 8px;border-radius:9px;font-size:12px;color:var(--mut);white-space:nowrap}
.theme button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.theme button span{display:none}
@media(min-width:520px){.theme button span{display:inline}}
@media(max-width:420px){.brand b{font-size:11.5px;letter-spacing:.02em}}
.hero{padding:6px 2px 14px}
.hero h1{font-size:24px;line-height:1.15;margin:4px 0 6px;letter-spacing:.02em}
.hero p{margin:0;color:var(--mut);font-size:14px}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--cyan);font-weight:700}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:6px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px;min-height:170px;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.big{grid-column:span 2;min-height:180px}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 60%);pointer-events:none}
.tile .ico{font-size:34px;line-height:1;margin-bottom:10px}
.tile .tag{font-size:10px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.tile h3{margin:3px 0 4px;font-size:17px;line-height:1.2}
.tile p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.4;flex:1}
.tile .bar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut)}
.tile .bar span.t{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.tile .bar span.t i{display:block;height:100%;background:var(--ac)}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mut);font-size:12.5px}
.note b{color:var(--gold)}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-size:13px;margin:4px 0 12px}
.ahead{border-radius:20px;padding:16px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden;margin-bottom:14px}
.ahead::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 120% at 100% 0%,color-mix(in srgb,var(--ac) 25%,transparent),transparent 60%)}
.ahead *{position:relative}
.ahead .ico{font-size:36px}
.ahead h2{margin:6px 0 4px;font-size:21px}
.ahead p{margin:0;color:var(--mut);font-size:13.5px}
.list{display:grid;gap:10px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px}
.lcard .n{font-size:10px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.lcard h4{margin:2px 0 2px;font-size:15px}
.lcard p{margin:0;color:var(--mut);font-size:12px}
.lcard .chk{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:14px;color:var(--mut)}
.lcard.seen .chk{background:var(--ac);border-color:var(--ac);color:#fff}
.player{border:1px solid var(--line);background:var(--panel);border-radius:20px;overflow:hidden}
.stage{position:relative;background:var(--scene);aspect-ratio:360/220}
.stage svg{display:block;width:100%;height:100%}
.ctrl{padding:10px 12px 12px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.pbtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-width:38px;height:34px;padding:0 10px;font-size:13px}
.pbtn.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
input[type=range]{flex:1;accent-color:var(--ac);min-width:60px}
.speeds{display:flex;gap:4px}
.speeds .pbtn{min-width:0;padding:0 8px;font-size:12px}
.speeds .pbtn.on{background:color-mix(in srgb,var(--ac) 25%,var(--panel2));border-color:var(--ac)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.steps button{width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12px}
.steps button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.steps button.done{border-color:var(--ac)}
.stxt{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);min-height:76px}
.stxt .k{font-size:10.5px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.stxt p{margin:4px 0 0;font-size:14.5px}
.info{display:grid;gap:10px;margin-top:14px}
@media(min-width:700px){.info{grid-template-columns:1fr 1fr}}
.ibox{border-radius:16px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.ibox b{display:block;font-size:11px;letter-spacing:.12em;color:var(--c);margin-bottom:4px}
.ibox p{margin:0;font-size:13.5px}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;font-size:13px;text-align:left}
.nav2 button small{display:block;color:var(--mut);font-size:11px}
.nav2 button.r{text-align:right}
.nav2 button:disabled{opacity:.35}
.lh{margin:0 0 10px}
.lh .n{font-size:11px;letter-spacing:.14em;color:var(--ac);font-weight:700}
.lh h2{margin:3px 0 0;font-size:20px;line-height:1.2}
.qcard{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px}
.qtop{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px}
.qcard h3{margin:4px 0 12px;font-size:17px;line-height:1.35}
.qimg{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--scene);margin-bottom:12px;aspect-ratio:360/220}
.qimg svg{display:block;width:100%;height:100%}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 13px;font-size:14px}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--panel2))}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--panel2))}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px}
.fb b.ok{color:var(--green)}.fb b.no{color:var(--red)}
.qbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qbtns button{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px;font-size:13.5px}
.qbtns button.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.score{font-size:46px;font-weight:800;margin:6px 0}
.rep{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rep li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;font-size:13px}
footer{margin-top:26px;color:var(--mut);font-size:11.5px;text-align:center}
@media(min-width:1000px){
 #side{display:block;width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel);height:100vh;position:sticky;top:0;overflow:auto;padding:16px 14px}
 #side input{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;margin:10px 0 12px}
 #side .sg{font-size:10.5px;letter-spacing:.14em;font-weight:700;margin:14px 4px 6px}
 #side button.si{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:7px 8px;font-size:13px;color:var(--tx)}
 #side button.si:hover,#side button.si.on{background:var(--panel2)}
 #side button.si .d{color:var(--mut);margin-left:auto}
 main{padding:0 28px 40px}
 .bento{grid-template-columns:repeat(3,1fr)}
 .tile.big{grid-column:span 2}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side"></aside>
 <main>
  <header class="top">
   <div class="brand" onclick="go('#start')"><div class="logo">🏭</div><div><b class="mono">BAYAZIT UNTERNEHMENS-SCHULE</b><small>Wie Firmen entstehen · 24 Unternehmen</small></div></div>
   <div class="theme" id="theme">
    <button data-m="dark" title="Dunkel">☾<span> Dunkel</span></button>
    <button data-m="light" title="Hell">☀<span> Hell</span></button>
    <button data-m="auto" title="Automatisch">◐<span> Auto</span></button>
   </div>
  </header>
  <div id="view"></div>
  <footer>Bayazit Unternehmens-Schule · Lern-App · Stand: 20. November 2026 · Zahlen laut Unternehmensangaben, ohne Gewähr, keine Anlageberatung · Alle Marken- und Produktnamen gehören ihren Inhabern</footer>
 </main>
</div>
<script>
"use strict";
const store={get(k,d){try{const v=localStorage.getItem("firma_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("firma_"+k,JSON.stringify(v))}catch(e){}}};
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
function applyTheme(){const m=store.get("theme","dark");const t=m==="auto"?(mq&&mq.matches?"light":"dark"):m;document.documentElement.setAttribute("data-theme",t);
 document.querySelectorAll("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.content=t==="light"?"#eef2f7":"#070b12";}
document.querySelectorAll("#theme button").forEach(b=>b.onclick=()=>{store.set("theme",b.dataset.m);applyTheme()});
if(mq&&mq.addEventListener)mq.addEventListener("change",applyTheme);
applyTheme();

/* ---------- Szenen-Bausteine ---------- */
const D=4.5;
const R=(s,x,y,w,h,c,o,x2)=>Object.assign({t:"rect",s,x,y,w,h,c,o},x2||{});
const P=(s,x,y,txt,c,x2)=>Object.assign({t:"pill",s,x,y,txt,c},x2||{});
const T=(s,x,y,txt,c,size,x2)=>Object.assign({t:"txt",s,x,y,txt,c,size},x2||{});
const A=(s,x1,y1,x2,y2,c,x3)=>Object.assign({t:"arrow",s,x1,y1,x2,y2,c},x3||{});
const Ln=(s,x1,y1,x2,y2,c,x3)=>Object.assign({t:"line",s,x1,y1,x2,y2,c},x3||{});
const C=(s,x,y,r,c,o,x2)=>Object.assign({t:"circ",s,x,y,r,c,o},x2||{});
const G=(s,pts,c,o,x2)=>Object.assign({t:"poly",s,pts,c,o},x2||{});
const E=(s,x,y,txt,size,x2)=>Object.assign({t:"emo",s,x,y,txt,size},x2||{});
const B=(s,x,y,w,h,c,x2)=>Object.assign({t:"bar",s,x,y,w,h,c},x2||{});
const HB=(s,x,y,w,h,c,x2)=>Object.assign({t:"hbar",s,x,y,w,h,c},x2||{});
const RING=(s,x,y,r,c,x2)=>Object.assign({t:"ring",s,x,y,r,c},x2||{});
const PATH=(s,pd,c,x2)=>Object.assign({t:"path",s,pd,c},x2||{});
const FL=(s,pts,c,x2)=>Object.assign({t:"flow",s,pts,c},x2||{});
const RAW=(s,svg,x2)=>Object.assign({t:"raw",s,svg},x2||{});
const SPIN=(s,x,y,r,c,x2)=>Object.assign({t:"spin",s,x,y,r,c},x2||{});
const BAT=(s,x,y,w,h,lv,c,x2)=>Object.assign({t:"bat",s,x,y,w,h,lv,c},x2||{});
/* Auto in Seitenansicht: x = linke Kante, y = Boden, k = Maßstab (200 breit bei k=1) */
function carSvg(x,y,k,c){return `<g transform="translate(${x} ${y}) scale(${k})">
<path d="M5,-22 L5,-42 Q8,-50 20,-52 L60,-56 L85,-78 Q92,-82 105,-82 L140,-82 Q150,-82 158,-74 L178,-56 L192,-52 Q198,-50 198,-42 L198,-22 Z" style="fill:var(--body);stroke:${c?`var(--${c})`:"var(--mut)"};stroke-width:2"/>
<path d="M68,-58 L89,-76 L118,-76 L118,-58 Z M124,-58 L124,-76 L141,-76 Q148,-76 152,-70 L162,-58 Z" style="fill:var(--glass)"/>
<circle cx="45" cy="-16" r="16" style="fill:var(--tire)"/><circle cx="45" cy="-16" r="7" style="fill:var(--mut)"/>
<circle cx="155" cy="-16" r="16" style="fill:var(--tire)"/><circle cx="155" cy="-16" r="7" style="fill:var(--mut)"/></g>`}
const CAR=(s,x,y,k,c,x2)=>RAW(s,carSvg(x,y,k,c),x2);
const MOT=(s,x,y,r,part,sp,x2)=>Object.assign({t:"mot",s,x,y,r,part,sp:sp||0},x2||{});
function box3d(s,x,y,w,h,dp,c,del){const o={d:del||0};return[
 G(s,`${x},${y} ${x+w},${y} ${x+w},${y-h} ${x},${y-h}`,c,.85,o),
 G(s,`${x},${y-h} ${x+dp},${y-h-dp*.6} ${x+w+dp},${y-h-dp*.6} ${x+w},${y-h}`,c,.55,o),
 G(s,`${x+w},${y} ${x+w+dp},${y-dp*.6} ${x+w+dp},${y-h-dp*.6} ${x+w},${y-h}`,c,.35,o)]}
function sinP(x0,x1,y,a,n,ph){let d="";for(let x=x0;x<=x1;x+=2){const v=y-a*Math.sin((x-x0)/(x1-x0)*n*2*Math.PI+ph);d+=(d?"L":"M")+x+","+v.toFixed(1)}return d}
/* ---------- Zusatz-Bausteine ---------- */
const YR=(s,x,yr,lab,c,x2)=>{const o=x2||{};return[C(s,x,120,7,c,1,o),T(s,x,104,yr,c,11,Object.assign({b:1,m:1},o)),T(s,x,142,lab,"mut",9,o)]};
/* Oldtimer in Seitenansicht: x = linke Kante, y = Boden */
function oldCarSvg(x,y,k,c){return `<g transform="translate(${x} ${y}) scale(${k})">
<path d="M8,-20 L8,-42 L40,-44 L52,-74 L104,-74 L112,-44 L150,-40 L152,-20 Z" style="fill:var(--body);stroke:var(--${c||"mut"});stroke-width:2"/>
<rect x="60" y="-68" width="20" height="20" rx="2" style="fill:var(--glass)"/><rect x="84" y="-68" width="20" height="20" rx="2" style="fill:var(--glass)"/>
<path d="M14,-20 Q30,-44 50,-20 M110,-20 Q128,-44 146,-20" style="fill:none;stroke:var(--mut);stroke-width:3"/>
<circle cx="32" cy="-14" r="14" style="fill:var(--tire)"/><circle cx="32" cy="-14" r="5" style="fill:var(--mut)"/>
<circle cx="128" cy="-14" r="14" style="fill:var(--tire)"/><circle cx="128" cy="-14" r="5" style="fill:var(--mut)"/></g>`}
const OLD=(s,x,y,k,c,x2)=>RAW(s,oldCarSvg(x,y,k,c),x2);
/* bayerische Rautenflagge (gemeinfrei) */
function rautenSvg(x,y,w,h){let o=`<defs><clipPath id="rc"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/></clipPath></defs><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" style="fill:#ffffff"/><g clip-path="url(#rc)">`;
 const dw=24,dh=16;for(let r=-1;r<h/dh*2+2;r++)for(let c=-1;c<w/dw+2;c++){if((r+c)%2)continue;const cx=x+c*dw+(r%2?dw/2:0),cy=y+r*dh/2;o+=`<polygon points="${cx},${cy-dh/2} ${cx+dw/2},${cy} ${cx},${cy+dh/2} ${cx-dw/2},${cy}" style="fill:#1e88e5"/>`}
 return o+`</g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" style="fill:none;stroke:var(--blue);stroke-width:2"/>`}
/* einfaches Motorrad */
function bikeSvg(){return `<g style="stroke:var(--tx);stroke-width:3;fill:none;stroke-linecap:round"><path d="M100,170 L150,118 L222,118 L250,170 M150,118 L172,160 L250,170 M140,118 L128,96 L116,96"/></g>
<circle cx="100" cy="170" r="28" style="fill:none;stroke:var(--tx);stroke-width:4"/><circle cx="100" cy="170" r="5" style="fill:var(--mut)"/>
<circle cx="250" cy="170" r="28" style="fill:none;stroke:var(--tx);stroke-width:4"/><circle cx="250" cy="170" r="5" style="fill:var(--mut)"/>
<rect x="152" y="102" width="44" height="16" rx="7" style="fill:var(--cyan)"/><rect x="198" y="106" width="34" height="8" rx="4" style="fill:var(--mut)"/>
<circle cx="172" cy="150" r="14" style="fill:var(--panel2);stroke:var(--violet);stroke-width:3"/>`}

/* ---------- Bereiche ---------- */
const BMW_AREAS=[
 {id:"anfang",name:"Die Gründung",yrs:"1913–1922",icon:"✈️",c:"cyan",desc:"Karl Rapp, Gustav Otto, der Name BMW, das blau-weiße Logo und der Neustart nach dem Ersten Weltkrieg."},
 {id:"aufbruch",name:"Motorräder & erste Autos",yrs:"1923–1940",icon:"🏍️",c:"gold",desc:"Die R 32, Rekordfahrten, der Dixi aus Eisenach, die Niere und der Sportwagen 328."},

/* ===== DER AUFSTIEG ===== */

 steps:["BMW braucht ein Auto für die Mitte: nicht zu groß, nicht zu klein – sportlich und modern.",

 "Neu ist die „Sportlimousine“: vier Türen, viel Platz für die Familie – und trotzdem sportlich zu fahren.",

{id:"d2",a:"aufstieg",title:"BMW kommt nach Niederbayern",sub:"Glas, Dingolfing und Landshut · 1967",

 "BMW baut in Dingolfing ein neues großes Werk. Ab 1973 laufen dort die ersten 5er vom Band – heute ist es das größte BMW-Werk in Deutschland.",

 "Ihr Buchstabe ist das „M“. Heute heißt die Firma BMW M GmbH – 2025 lieferte sie über 213.000 Fahrzeuge aus.",

{id:"d4",a:"aufstieg",title:"Die Baureihen entstehen",sub:"3er, 5er, 6er, 7er · ab 1972",

 "1972 kommt der erste 5er. Er ist die obere Mittelklasse und wird ab 1973 in Dingolfing gebaut.",
 "1975 folgt der 3er – kompakt und sportlich. Er wird zum meistverkauften BMW.",
 "1976 kommt der 6er als Coupé, 1977 der 7er als große Luxuslimousine.",
 "1986 eröffnet BMW ein neues Werk in Regensburg. Die Produktion wächst und wächst."],

 "Nvidia geht fast das Geld aus, viele Mitarbeiter müssen gehen. Huang macht daraus später einen Leitsatz: „Wir sind 30 Tage von der Pleite entfernt.“",
 "1997 kommt die Rettung: der RIVA 128. Er rechnet mit Dreiecken und ist sehr schnell. In vier Monaten werden rund eine Million Stück verkauft.",

 steps:["Am 22. Januar 1999 geht Nvidia an die Börse Nasdaq. Eine Aktie kostet beim Start 12 Dollar.",

 "Im Herbst 1999 kommt die GeForce 256. Nvidia nennt sie „die erste GPU der Welt“ – Graphics Processing Unit, auf Deutsch Grafikprozessor.",
 "Neu: Die GeForce 256 berechnet Licht und Bewegung der 3D-Objekte selbst. Vorher musste das der Hauptprozessor (CPU) erledigen.",
 "Der Name GeForce lebt bis heute weiter – von der GeForce 256 bis zur GeForce RTX 50."],

{id:"g1",a:"gaming",title:"Was ist eine GPU?",sub:"CPU gegen GPU",
 steps:["Jeder Computer hat einen Hauptprozessor, die CPU. Sie hat wenige, aber sehr starke Rechenkerne – zum Beispiel 8 oder 16.",
 "Eine CPU ist wie ein kleines Team aus Professoren: Sie lösen schwierige Aufgaben schnell, aber immer nur wenige gleichzeitig.",
 "Eine GPU hat tausende kleine Rechenkerne. Die GeForce RTX 5090 hat 21.760 davon.",
 "Eine GPU ist wie ein Stadion voller Schüler: Jeder rechnet nur eine einfache Aufgabe – aber alle gleichzeitig.",
 "Für Bilder ist das perfekt: Viele Bildpunkte (Pixel) können gleichzeitig berechnet werden. Das nennt man paralleles Rechnen."],

 bed:"Weil Bilder und auch künstliche Intelligenz aus Millionen gleicher Rechnungen bestehen, ist die GPU dafür ideal.",
 tipp:"Bei Nvidia heißen die kleinen Rechenkerne „CUDA-Kerne“."}},
{id:"g2",a:"gaming",title:"Wie ein Spielbild entsteht",sub:"Dreiecke, Pixel, Bilder pro Sekunde",
 steps:["Jede Spielfigur und jedes Auto im Spiel besteht aus vielen kleinen Dreiecken – einem Gittermodell.",
 "Die GPU legt Farben und Oberflächen (Texturen) über die Dreiecke. So wird aus dem Gitter ein echtes Objekt.",
 "Dann rechnet die GPU aus, welche Farbe jeder Bildpunkt (Pixel) auf dem Bildschirm bekommt.",
 "Ein 4K-Bild hat 3.840 × 2.160 = rund 8,3 Millionen Pixel. Alle müssen berechnet werden.",
 "Das passiert 60-mal pro Sekunde oder öfter (60 FPS). So entsteht ein flüssiges Bild – rund 500 Millionen Pixel pro Sekunde."],

{id:"g3",a:"gaming",title:"Raytracing & RTX",sub:"Echte Lichtstrahlen · seit 2018",
 steps:["Früher wurden Licht und Schatten in Spielen nur geschätzt – mit Tricks. Das sah gut, aber nicht ganz echt aus.",
 "Raytracing heißt Strahlenverfolgung: Die GPU schickt Lichtstrahlen von der Kamera in die Szene.",
 "Trifft ein Strahl auf eine Fläche, wird er gespiegelt oder es entsteht ein Schatten – genau wie bei echtem Licht.",
 "2018 stellt Nvidia auf der Gamescom in Köln die GeForce RTX 20 vor – die ersten Spielegrafikkarten mit eigenen Raytracing-Kernen (RT-Kernen).",
 "Seitdem tragen Nvidias Spielekarten das Kürzel RTX – „RT“ steht für Raytracing."],

{id:"g4",a:"gaming",title:"DLSS – die KI malt mit",sub:"Mehr Bilder dank künstlicher Intelligenz",
 steps:["Raytracing in 4K ist sehr anstrengend für die Grafikkarte. Die Bilder pro Sekunde (FPS) sinken.",
 "Der Trick heißt DLSS (Deep Learning Super Sampling): Die GPU berechnet das Bild zuerst in kleinerer Auflösung.",
 "Eine künstliche Intelligenz rechnet das Bild dann scharf auf 4K hoch. Dafür hat die GPU eigene KI-Kerne (Tensor-Kerne).",
 "Mit DLSS 4 (2025, GeForce RTX 50) erzeugt die KI sogar ganze Zwischenbilder: Auf ein berechnetes Bild kommen bis zu drei von der KI erzeugte.",
 "Ergebnis: Das Spiel läuft viel flüssiger – ohne dass man einen großen Unterschied sieht."],

 "2020: RTX 30 · 2022: RTX 40 mit DLSS 3. Jede Generation wird deutlich schneller.",

{id:"c1",a:"ki",title:"CUDA – Grafikchips rechnen alles",sub:"2006 · der Schlüssel zum Erfolg",
 steps:["Forscher merken Anfang der 2000er: GPUs können nicht nur Bilder rechnen, sondern auch Wetter, Physik oder Medizin – wenn man sie richtig programmiert.",
 "Das war aber sehr kompliziert. 2006 stellt Nvidia deshalb CUDA vor: eine Programmier-Plattform für seine GPUs.",
 "Mit CUDA zerlegen Programmierer ihre Rechenaufgabe in tausende kleine Teile und verteilen sie auf alle GPU-Kerne.",
 "Nvidia investiert jahrelang Milliarden in CUDA – obwohl es zuerst kaum Geld einbringt. Viele Experten halten das damals für einen Fehler.",

 steps:["2012 läuft ein großer Wettbewerb: Ein Computer soll auf Fotos erkennen, was zu sehen ist – Hund, Katze, Auto … Zum Lernen gibt es 1,2 Millionen Bilder.",

 "Trainiert wird es nicht auf einem Supercomputer, sondern auf zwei GeForce GTX 580 – ganz normalen Spielegrafikkarten – bei Alex Krizhevsky zu Hause.",
 "AlexNet liegt nur bei rund 15 % Fehlern – das zweitbeste Programm bei 26 %. Ein riesiger Sprung!",

{id:"c3",a:"ki",title:"Tensor-Kerne & Matrizen",sub:"Das Rechnen hinter der KI",

 "So geht's: Eine Zeile wird mit einer Spalte malgenommen und zusammengezählt – 1·5 + 2·7 = 19.",
 "Für eine große KI sind das Billionen solcher Rechnungen – für jedes einzelne Wort, das sie schreibt.",
 "2017 baut Nvidia in die Volta-GPU V100 erstmals Tensor-Kerne ein: Spezialkerne, die ganze Matrix-Blöcke auf einmal rechnen.",

{id:"c4",a:"ki",title:"Training & Inferenz",sub:"Warum KI so viele GPUs braucht",
 steps:["Eine KI wie ein Chatbot muss zuerst lernen. Das heißt Training: Sie liest riesige Mengen Text und passt dabei Milliarden Zahlen an.",
 "Das Training großer KI-Modelle dauert Wochen bis Monate – auf zehntausenden GPUs gleichzeitig.",
 "Danach wird die KI benutzt: Sie beantwortet Fragen. Das heißt Inferenz.",
 "Bei der Inferenz entsteht jede Antwort Stück für Stück aus kleinen Wortteilen, den Tokens. Jedes Token kostet Rechenleistung.",
 "Weil Millionen Menschen täglich KI nutzen, braucht vor allem die Inferenz immer mehr GPUs. Deshalb wächst Nvidias Rechenzentrums-Geschäft so stark."],

 "Die Idee: Dieses Wissen und diese Rechenleistung an andere Firmen vermieten. 2006 startet Amazon Web Services, kurz AWS.",
 "Firmen müssen keine eigenen Server mehr kaufen. Sie mieten Speicher und Rechenzeit – und zahlen nur, was sie nutzen.",
 "AWS war der erste große Cloud-Anbieter – Microsoft (Azure) und Google kamen erst später.",
 "AWS ist heute Amazons Gewinnmaschine: 2025 brachte es 128,7 Mrd. $ Umsatz und 45,6 Mrd. $ Betriebsgewinn – mehr als die Hälfte von Amazons Betriebsgewinn."],

 T(2,232,148,"nur zahlen, was man nutzt","mut",9,{b:1}),
 T(3,232,172,"erster großer Cloud-Anbieter","blue",10,{b:1}),
 P(4,180,24,"2025: 128,7 Mrd. $ Umsatz","green"),T(4,232,198,"Betriebsgewinn: 45,6 Mrd. $","green",10,{b:1,m:1})],
 info:{was:"AWS (Amazon Web Services) ist Amazons Cloud – Rechenleistung und Speicher zum Mieten.",
 so:"Viele bekannte Apps und Webseiten laufen im Hintergrund auf AWS.",

 tipp:"Rechne: 45,6 ÷ 80,0 = 0,57 – 57 % von Amazons Betriebsgewinn 2025 kamen von AWS."}},

 "Ende 2025 bringen diese eigenen Chips zusammen über 10 Mrd. $ Umsatz pro Jahr – mit dreistelligem Wachstum.",
 "Im Shop hilft der KI-Assistent Rufus beim Einkaufen: 2025 nutzten ihn über 300 Millionen Kunden.",

 <div class="info"><div class="ibox" style="--c:var(--blue)"><b class="mono">WAS IST DAS?</b><p>${l.info.was}</p></div>
 <div class="ibox" style="--c:var(--green)"><b class="mono">SO ERKENNST DU ES</b><p>${l.info.so}</p></div>
 <div class="ibox" style="--c:var(--gold)"><b class="mono">WAS BEDEUTET ES?</b><p>${l.info.bed}</p></div>
 <div class="ibox" style="--c:var(--red)"><b class="mono">TIPP</b><p>${l.info.tipp}</p></div></div>
 <div class="nav2"><button ${prev?"":"disabled"} onclick="go('#l-${prev?prev.id:""}')"><small>← Zurück</small>${prev?prev.title:"–"}</button>
 <button class="r" ${next?"":"disabled"} onclick="go('#l-${next?next.id:""}')"><small>Weiter →</small>${next?next.title:"–"}</button></div></div>`}

/* ---------- Quiz ---------- */
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(key){const pool=key==="all"?Q:Q.filter(q=>q.co===key);
 quiz={key,qs:shuffle(pool).slice(0,10).map(q=>({...q,opts:shuffle(q.a.map((t,i)=>({t,ok:i===0})))})),i:0,pts:0,wrong:[],answered:false}}
function viewQuiz(key){if(!quiz||quiz.key!==key)newQuiz(key);const z=quiz,n=z.qs.length,co=coOf(key);
 const back=co?`<button class="back" onclick="go('#u-${co.id}')">← ${co.name}</button>`:`<button class="back" onclick="go('#start')">← Alle Unternehmen</button>`;
 if(z.i>=n){const best=Math.max(store.get("best_"+key,0)||0,z.pts);store.set("best_"+key,best);
  const rep=[...new Set(z.wrong)].map(id=>L.find(l=>l.id===id));
  return `<div style="--ac:var(--cyan)">${back}<div class="qcard" style="text-align:center">
  <div class="kicker mono">ERGEBNIS${co?" · "+co.name.toUpperCase():""}</div><div class="score mono">${z.pts} / ${n}</div><p style="color:var(--mut);margin:0">Bestwert: ${best} / ${n}</p>
  ${rep.length?`<p style="margin:16px 0 0;text-align:left;font-weight:700">Diese Lektionen solltest du wiederholen:</p><ul class="rep">${rep.map(l=>`<li><button onclick="go('#l-${l.id}')">${area(l.a).icon} ${l.title}</button></li>`).join("")}</ul>`:`<p style="margin-top:14px">Alles richtig – stark! 🏆</p>`}
  <div class="qbtns"><button class="main" onclick="newQuiz('${key}');route()">Neues Quiz</button><button onclick="go('${co?"#u-"+co.id:"#start"}')">Zurück</button></div></div></div>`}
 const q=z.qs[z.i];const img=q.img?L.find(l=>l.id===q.img):null;
 return `<div style="--ac:var(--cyan)">${back}<div class="qcard">
 <div class="qtop mono"><span>FRAGE ${z.i+1} / ${n}${key==="all"?" · "+coOf(q.co).name.toUpperCase():""}</span><span>Punkte: ${z.pts}</span></div><div class="prog" style="margin:0 0 10px"><i style="width:${z.i/n*100}%"></i></div>
 ${img?`<div class="qimg">${svgWrap(renderScene(img.els.filter(e=>e.e==null),99))}</div>`:""}
 <h3>${q.q}</h3><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div><div id="fb"></div></div></div>`}
function bindQuiz(){const z=quiz;if(!z||z.i>=z.qs.length)return;const q=z.qs[z.i],n=z.qs.length;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(z.answered)return;z.answered=true;const o=q.opts[+b.dataset.k];
  if(o.ok)z.pts++;else z.wrong.push(q.l);
  document.querySelectorAll(".opt").forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok");else if(x===b)x.classList.add("no")});
  const l=L.find(x=>x.id===q.l);
  $("#fb").innerHTML=`<div class="fb"><b class="${o.ok?"ok":"no"}">${o.ok?"✓ Richtig!":"✗ Leider falsch."}</b> ${q.ex}</div>
  <div class="qbtns"><button onclick="go('#l-${l.id}')">📖 Zur Lektion</button><button class="main" id="nx">${z.i<n-1?"Nächste Frage →":"Ergebnis anzeigen"}</button></div>`;
  $("#nx").onclick=()=>{z.i++;z.answered=false;route();window.scrollTo(0,0)}})}

/* ---------- Seitenleiste (PC) ---------- */
function renderSide(cur){const s=seen(),qv=(store._q||"").toLowerCase();
 let h=`<div class="brand" onclick="go('#start')"><div class="logo">🏭</div><div><b class="mono">UNTERNEHMENS-SCHULE</b><small>${L.filter(l=>s[l.id]).length}/${L.length} gesehen</small></div></div>
 <input id="sq" placeholder="🔍 Lektion suchen …" value="${esc(store._q||"")}">`;
 COS.forEach(co=>{let ch="";
  AREAS.filter(a=>a.co===co.id).forEach(a=>{const ls=L.filter(l=>l.a===a.id&&(!qv||(co.name+" "+l.title+" "+l.sub+" "+l.steps.join(" ")).toLowerCase().includes(qv)));if(!ls.length)return;
   ch+=`<div class="sg mono" style="color:${col(a.c)}">${a.icon} ${a.name.toUpperCase()}</div>`;
   ls.forEach(l=>ch+=`<button class="si ${cur===l.id?"on":""}" onclick="go('#l-${l.id}')">${l.title}<span class="d">${s[l.id]?"✓":""}</span></button>`)});
  if(ch)h+=`<button class="si mono" style="margin-top:16px;font-weight:800;color:${col(co.c)}" onclick="go('#u-${co.id}')">${co.icon} ${co.name.toUpperCase()}</button>`+ch});
 h+=`<div class="sg mono" style="color:var(--cyan)">🎯 QUIZ</div>`+COS.map(co=>`<button class="si ${cur==="q-"+co.id?"on":""}" onclick="go('#q-${co.id}')">Quiz ${co.name}</button>`).join("")+`<button class="si ${cur==="quiz"?"on":""}" onclick="go('#quiz')">Gemischtes Quiz</button>`;
 $("#side").innerHTML=h;const inp=$("#sq");inp.oninput=()=>{store._q=inp.value;const pos=inp.selectionStart;renderSide(cur);const n=$("#sq");n.focus();n.setSelectionRange(pos,pos)}}

/* ---------- Routing ---------- */
function route(){stopPlayer();const h=location.hash||"#start";const m=h.slice(1);let cur="";
 const v=$("#view");
 if(m.startsWith("u-")){v.innerHTML=viewCompany(m.slice(2))}
 else if(m.startsWith("b-")){v.innerHTML=viewArea(m.slice(2))}
 else if(m.startsWith("l-")){const id=m.slice(2);v.innerHTML=viewLesson(id);cur=id;const l=L.find(x=>x.id===id);if(l)startPlayer(l)}
 else if(m==="quiz"){v.innerHTML=viewQuiz("all");bindQuiz();cur="quiz"}
 else if(m.startsWith("q-")&&coOf(m.slice(2))){v.innerHTML=viewQuiz(m.slice(2));bindQuiz();cur=m}
 else v.innerHTML=viewHome();
 renderSide(cur);if(route._last!==h)window.scrollTo(0,0);route._last=h}
window.addEventListener("hashchange",()=>{if(quiz&&quiz.i>=quiz.qs.length)quiz=null;route()});
route();
if("serviceWorker"in navigator&&location.protocol==="https:"&&!/claude|anthropic|usercontent/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
